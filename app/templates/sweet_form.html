<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Sweet</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{url_for('static', filename='css/sweet_add.css')}}">
</head>
<body>

    <div class="product-form">
        
        <h2>Add Sweet</h2>

        {% if error %}
            <h3 style="color:red;">{{error}}<h3>
        {% endif %}
        
        <!-- enctype is IMPORTANT for image upload -->
        
        <form method="POST" action="{{ url_for('admin_sweet_route.add_sweet') }}" enctype="multipart/form-data">

            <div class="form-group">
                <label for="image">Sweet Image</label>
                <input type="file" name="image" id="image" accept="image/*">
            </div>

            <div class="form-group">
                <label for="name">Sweet Name</label>
                <input type="text" name="name" id="name" placeholder="Enter product name" required>
            </div>

            <div class="form-group">
                <label for="price">Price (₹)</label>
                <input type="number" name="price" id="price" step="0.01" min="0" placeholder="Enter price" required>
            </div>

            <div class="form-group">
                <label for="stock">Stock</label>
                <input type="number" name="stock" id="stock" min="0" placeholder="Available quantity" required>
            </div>

            <div class="form-group">
                <button type="submit">Add Sweet</button>
            </div>

        </form>
    </div>

</body>
</html>
