<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Sweet</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{url_for('static', filename='css/sweet_add.css')}}">
</head>
<body>

    <div class="product-form">
        <h2>Edit Sweet</h2>

        {% if error %}
            <h3 style="color:red;">{{error}}<h3>
        {% endif %}
        
        <!-- enctype is IMPORTANT for image upload -->
        
        {% if sweet_details %}
            <form method="POST" action="{{ url_for('admin_sweet_route.update_sweet', sweet_id=sweet_details.id) }}" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="image">Sweet Image</label>
                    <input type="file" name="image" id="image" accept="image/*">
                </div>

                <div class="form-group">
                    <label for="name">Sweet Name</label>
                    <input type="text" name="name" id="name" value="{{sweet_details.name}}" placeholder="Enter product name">
                </div>

                <div class="form-group">
                    <label for="price">Price (₹)</label>
                    <input type="number" name="price" id="price" step="0.01" min="0" value="{{sweet_details.price}}" placeholder="Enter price">
                </div>

                <div class="form-group">
                    <label for="stock">Stock</label>
                    <input type="number" name="stock" id="stock" min="0" value="{{sweet_details.stock}}" placeholder="Available quantity">
                </div>

                <div class="form-group">
                    <label for="stock">Is Active</label>
                    {% if sweet_details.is_active %}
                        <input type="text" name="is_active" id="is_active" value="yes" placeholder="type yes if sweet is active">
                    {% else %}
                        <input type="text" name="is_active" id="is_active" value="no" placeholder="type yes if sweet is active">
                    {% endif %}
                </div>

                <div class="form-group">
                    <button type="submit">Update</button>
                </div>

            </form>
        {% endif %}
    </div>

</body>
</html>
