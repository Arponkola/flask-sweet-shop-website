<!Doctype html>
<html>
    <head>
        <title>update form</title>
        <link rel="stylesheet" href="{{url_for('static', filename='css/update.css')}}">
        <meta>
    </head>
    <body>
        <h1>Update Credential</h1>
        
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        
        <div class="form-box">
            <form method='POST' action="{{ url_for('admin_route.users_update', user_id=user_details.userId) }}">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type='text' name="name" id="name" value="{{user_details.name}}">
                </div>

                <div class="form-group">
                    <label for="email">Email<label>
                    <input type="email" name="email" id="email" value="{{user_details.email}}">
                </div>

                <div class="form-group">
                    <label for="mobile">Mobile<label>
                    <input type="text" name="mobile" id="mobile" value="{{user_details.mobile_number}}">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" name="password" id="password" minlength="6">
                </div>

                <div class="form-group">
                    <label for="is_admin">Admin</label>
                    <input type="text" name="is_admin" id="is_admin" value="{{admin}}" placeholder="if admin type yes...">
                </div>

                <div class="form-group">
                    <button type="submit">Update</button>
                </div>
            </form>
        </div>
    </body>
</html>
